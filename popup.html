<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Attention, please!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 420px;
      background-color: #0a0a0a;
      background-image: radial-gradient(#242424 1px, transparent 1px);
      background-size: 14px 14px;
      color: #e5e5e5;
      font-family: 'Consolas', 'Courier New', monospace;
      padding: 18px 20px;
      border: 2px solid #383838;
      transition: border-color 0.25s ease;
    }
    body.stage-2 {
      border-color: #d946ef;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2b2b2b;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #fff;
    }
    .status-badge {
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      background: #141414;
      border: 1px solid #525252;
      color: #a3a3a3;
    }
    .status-badge.locked {
      border-color: #ef4444;
      color: #fca5a5;
      background: #2a0a0a;
    }
    .hidden {
      display: none !important;
    }

    /* Always-Visible Mystery Shelf Toggle */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111111;
      border: 1px solid #2e2e2e;
      padding: 13px;
      margin-bottom: 14px;
      gap: 12px;
    }
    .toggle-label {
      font-size: 14px;
      font-weight: bold;
      color: #e5e5e5;
    }
    .toggle-sub {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
      line-height: 1.35;
    }
    .toggle-btn {
      background: #141414;
      color: #a3a3a3;
      border: 2px solid #404040;
      box-shadow: 3px 3px 0px #262626;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .toggle-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #262626;
    }
    .toggle-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 3px 3px 0px #525252;
    }
    .toggle-btn.active:active {
      box-shadow: 1px 1px 0px #525252;
    }

    /* Beg for Freedom Section */
    .lock-banner {
      background: #180d1c;
      border-left: 4px solid #d946ef;
      padding: 11px 14px;
      font-size: 13px;
      color: #f0abfc;
      margin-bottom: 12px;
      line-height: 1.45;
    }
    .chat-box {
      height: 165px;
      overflow-y: auto;
      background: #0e0e0e;
      border: 1px solid #2e2e2e;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 15px;
      line-height: 1.45;
    }
    .msg-ai {
      background: #161616;
      padding: 8px 12px;
      border-left: 4px solid #666;
      color: #e5e5e5;
      font-size: 15px;
    }
    body.stage-2 .msg-ai {
      background: #180d1c;
      border-left-color: #d946ef;
    }
    .msg-user {
      align-self: flex-end;
      background: #222;
      border: 1px solid #383838;
      padding: 7px 12px;
      color: #fff;
      font-size: 15px;
    }
    .input-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 72px;
      background: #141414;
      border: 2px solid #555555;
      color: #ffffff;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      resize: none;
      outline: none;
      border-radius: 4px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    textarea::placeholder {
      color: #888888;
      font-style: italic;
      font-weight: normal;
    }
    textarea:focus {
      border-color: #ffffff;
      background: #1c1c1c;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
    }
    body.stage-2 textarea {
      border-color: #9d174d;
      background: #180a1c;
      color: #fdf4ff;
    }
    body.stage-2 textarea::placeholder {
      color: #c084fc;
    }
    body.stage-2 textarea:focus {
      border-color: #d946ef;
      background: #230d29;
      box-shadow: 0 0 12px rgba(217, 70, 239, 0.45);
    }
    .submit-btn {
      width: 100%;
      background: #d946ef;
      color: #000000;
      border: 2px solid #d946ef;
      box-shadow: 3px 3px 0px #701a75;
      padding: 11px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .submit-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #701a75;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 10px;
      border-top: 1px solid #222;
    }
    .reset-btn {
      background: transparent;
      border: none;
      color: #666;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .reset-btn:hover {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">ATTENTION, PLEASE!</span>
    <span class="status-badge" id="statusBadge">IDLE</span>
  </div>

  <!-- Always Visible: Mystery Shelf Toggle -->
  <div id="normalView">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Mystery Shelf</div>
        <div class="toggle-sub">Suppress thumbnails &amp; randomize clicks</div>
      </div>
      <button class="toggle-btn" id="toggleMysteryBtn">OFF</button>
    </div>
  </div>

  <!-- Appears Below Toggle When Committed to a Video -->
  <div id="freedomView" class="hidden">
    <div class="lock-banner" id="lockBanner">
      COMMITMENT ACTIVE: Toggling Mystery Shelf won't save you. Finish the video—or beg for freedom.
    </div>
    <div class="chat-box" id="chatLog"></div>
    <div class="input-row" id="inputRow">
      <textarea id="pleaInput" placeholder="Beg to escape this video..." rows="2" autocomplete="off" spellcheck="false"></textarea>
      <button class="submit-btn" id="sendBtn">BEG [ENTER]</button>
    </div>
  </div>

  <div class="footer">
    <button class="reset-btn" id="emergencyResetBtn">[EMERGENCY RESET]</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
