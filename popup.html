<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      background: #0d0d0d;
      color: #e5e5e5;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .header {
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #ffffff;
    }
    .tagline {
      font-size: 11px;
      color: #777;
      margin-top: 3px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
    }
    button {
      background: #1f1f1f;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    button.active {
      background: #ffffff;
      color: #000000;
      font-weight: bold;
    }
    .status {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
      line-height: 1.4;
    }
    .commitment-box {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #262626;
      font-size: 11px;
      color: #f0abfc;
      display: none;
    }
    .commitment-box.visible {
      display: block;
    }
    .footer {
      margin-top: 14px;
      padding-top: 8px;
      border-top: 1px dashed #222;
      display: flex;
      justify-content: flex-end;
    }
    .reset-btn {
      background: transparent;
      border: none;
      color: #555;
      font-size: 10px;
      padding: 0;
      cursor: pointer;
    }
    .reset-btn:hover {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">ATTENTION, PLEASE!</div>
    <div class="tagline">You clicked it. Now live with it.</div>
  </div>

  <div class="row">
    <span class="label">Mystery Shelf</span>
    <button id="toggleBtn">OFF</button>
  </div>

  <div class="status" id="statusText">Visual masking inactive.</div>

  <div class="commitment-box" id="commitmentBox">
    COMMITMENT ACTIVE: Locked to current video until completion.
  </div>

  <div class="footer">
    <button class="reset-btn" id="resetBtn">[EMERGENCY RESET]</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
